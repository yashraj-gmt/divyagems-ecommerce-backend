# ==========================================
# Divya Gems - E-Commerce Backend
# ==========================================

spring.application.name=divyagems-ecommerce

# ------------------------------------------
# SERVER CONFIGURATION
# ------------------------------------------
server.port=8080
server.servlet.context-path=/api

# ------------------------------------------
# DATABASE - PostgreSQL + HikariCP
# ------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/divyagems_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DivyaGemsHikariPool

# ------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------------------
# FLYWAY MIGRATIONS
# ------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ------------------------------------------
# FILE UPLOAD
# ------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=${UPLOAD_DIR:uploads/}

# ------------------------------------------
# LOGGING
# ------------------------------------------
logging.level.root=WARN
logging.level.com.divyagems=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ------------------------------------------
# JWT CONFIGURATION
# ------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ------------------------------------------
# CORS CONFIGURATION
# ------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ------------------------------------------
# SPRINGDOC / SWAGGER UI
# ------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ------------------------------------------
# ACTUATOR
# ------------------------------------------
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ------------------------------------------
# RAZORPAY PAYMENT GATEWAY
# ------------------------------------------
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
app.razorpay.currency=INR

# ------------------------------------------
# ORDER SETTINGS
# ------------------------------------------
app.order.free-shipping-threshold=999
app.order.shipping-charge=99
app.order.tax-rate=0.00
